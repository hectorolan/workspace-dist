name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push supersedes the previous one (cicd-pipeline-skill
# playbook §1). The deploy pipeline reads the check runs of the newest commit only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Case-ID uniqueness: two tests claiming one TP-…-NNN let one plan's green run
  # satisfy another plan's case in plan-close (the PR #33 vs #34 collision,
  # 2026-08-02). The tool is vendored (scripts/case-id-check.mjs — see its
  # header); --refs origin/main also catches a branch claiming an ID main
  # already owns. Known limits: two concurrently OPEN PRs see each other only
  # when one merges and the other reruns CI, and a spec-file rename can
  # false-flag (same ID at the old path on origin/main and the new path here).
  case-ids:
    name: case-id uniqueness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: git fetch origin main
      - run: node scripts/case-id-check.mjs --refs origin/main

  test:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm test

  e2e:
    name: e2e (playwright)
    needs: test # fail fast on the cheap suite before spinning up a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Browser binaries are the slow part; key them to the lockfile so the cache
      # only misses when the Playwright version actually changes (playbook §2).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # The suite starts its own app + stub log API (playwright.config.js).
      # AUTH_BYPASS lives only in that config — never in a deployed environment.
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
